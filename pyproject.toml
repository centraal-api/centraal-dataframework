[tool.poetry]
name = "centraal_dataframework"
version = "0.2.0"
homepage = "https://github.com/centraal-api/centraal-dataframework"
description = "Framework para ejecutar transformaciones y calidad de datos sobre Azure Functions."
authors = ["centraal.studio <equipo@centraal.studio>"]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
packages = [
    { include = "centraal_dataframework" },
    { include = "tests", format = "sdist" },
]

[tool.poetry.dependencies]
# GX 1.x declara <3.15. azure-functions 1.x cubre 3.10-3.12 y 2.x exige >=3.13.
python = ">=3.10,<3.15"
azure-functions = [
    { version = ">=1.17,<2.0", python = "<3.13" },
    { version = ">=2.0,<3.0", python = ">=3.13" },
]
azure-datalake-utils = ">=0.6.0,<1.0"
azure-identity = ">=1.15,<2.0"
azure-data-tables = ">=12.5,<13.0"
great-expectations = ">=1.3,<2.0"
pandas = ">=2.2,<3.0"
numpy = ">=1.26,<3.0"
pyyaml = ">=6.0,<7.0"
requests = ">=2.28,<3.0"
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"
croniter = ">=2.0,<3.0"
pyodbc = { version = ">=5.1,<6.0", optional = true }

[tool.poetry.extras]
synapse = ["pyodbc"]

[tool.poetry.group.test.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
black = "^24.0"
isort = "^5.13"
flake8 = ">=7.0"
flake8-docstrings = "^1.7"

[tool.poetry.group.dev.dependencies]
tox = "^4.0"
pre-commit = "^3.0"
virtualenv = "^20.0"
pip = ">=24.0"
twine = "^5.0"
toml = "^0.10.2"
bump2version = "^1.0.1"
jupyter = ">=1.0"
python-dotenv = ">=1.0.0,<2.0"

[tool.poetry.group.doc.dependencies]
mkdocs = "^1.5"
mkdocs-include-markdown-plugin = "^6.0"
mkdocs-material = "^9.0"
mkdocstrings = { version = "^0.24", extras = ["python"] }
mkdocs-autorefs = "^1.0"
markupsafe = ">=2.1"

[tool.poetry.scripts]
centraal-dataframework = "centraal_dataframework.cli:main"

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
