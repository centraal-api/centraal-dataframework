[flake8]
max-line-length = 120
max-complexity = 18
ignore = E203, E266, W503
docstring-convention = google
per-file-ignores = __init__.py:F401,__main__.py:F401
exclude = .git,
    __pycache__,
    setup.py,
    build,
    dist,
    docs,
    releases,
    .venv,
    .tox,
    .mypy_cache,
    .pytest_cache,
    .vscode,
    .github,


[coverage:run]
source = centraal_dataframework
branch = true

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main
fail_under = 70


[tool:pytest]
markers =
    synapse: integracion contra Synapse real (requiere SYNAPSE_WORKSPACE o SYNAPSE_SERVER y pyodbc)


[tox:tox]
isolated_build = true
envlist = py310, py311, py312, py313, py314, format, lint, build

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311
    3.10: py310, format, lint, build

[testenv]
allowlist_externals = pytest
deps =
    pytest
    pytest-cov
    black
    isort
    flake8
    flake8-docstrings
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest --cov=centraal_dataframework --cov-branch --cov-report=xml --cov-report=term-missing tests

[testenv:format]
allowlist_externals =
    isort
    black
deps =
    isort
    black
commands =
    isort centraal_dataframework tests
    black centraal_dataframework tests

[testenv:lint]
allowlist_externals =
    flake8
deps =
    flake8
    flake8-docstrings
commands =
    flake8 centraal_dataframework tests

[testenv:build]
allowlist_externals =
    poetry
    mkdocs
    twine
deps =
    mkdocs
    mkdocs-include-markdown-plugin
    mkdocs-material
    mkdocstrings[python]
    mkdocs-autorefs
    twine
commands =
    poetry build
    mkdocs build
    twine check dist/*
