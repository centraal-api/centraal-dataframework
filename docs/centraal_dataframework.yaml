# Ejemplo de configuración. Copiar a la raíz del Function App como
# centraal_dataframework.yaml y completar con valores reales.
# La URL de Logic App NO va aquí: usar la variable LOGICAPP_EMAIL_URL.
emails_notificar:
  - equipo@example.com
tareas:
  # deben tener el nombre de la función definida (o el name= del decorador).
  hello_datalake:
    dias: '*'
    horas: 8,12,20
  hello_gx:
    dias: '*'
    horas: '*'
    emails:
      - dq@example.com
    enabled: true
    # opcional Fase B:
